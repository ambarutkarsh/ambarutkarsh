services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CONFIG_DB_NAME:-streamliner_config}
      POSTGRES_USER: ${CONFIG_DB_USER:-streamliner}
      POSTGRES_PASSWORD: ${CONFIG_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONFIG_DB_USER:-streamliner} -d ${CONFIG_DB_NAME:-streamliner_config}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamliner

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamliner

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      CONFIG_DB_HOST: postgres
      CONFIG_DB_PORT: 5432
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - streamliner

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - streamliner

volumes:
  postgres_data:
  redis_data:

networks:
  streamliner:
    driver: bridge
