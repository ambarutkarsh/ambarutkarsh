[project]
name = "closer"
version = "0.1.0"
description = "Ambar's autonomous cold-email agent for RetentionOS and Class, powered by Claude Code."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
closer = "closer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["closer"]
