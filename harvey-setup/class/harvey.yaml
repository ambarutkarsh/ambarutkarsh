# Harvey config for Class. install.sh copies this into its own Harvey checkout.
# Lines marked TODO need your real values before Harvey sends anything.

persona:
  name: "Ambar Utkarsh"
  company: "Class"
  role: "Founder & Instructor"
  email: "ambar@YOUR-SENDING-DOMAIN.com"     # TODO: mailbox on a dedicated sending domain
  linkedin: "linkedin.com/in/YOUR-HANDLE"     # TODO
  tone: "warm, direct, mentor-like; practical about careers, never hype"

product:
  name: "Class: AI Product Management"
  description: "A 6-month AI Product Management course taught by Ambar Utkarsh for students and professionals moving into AI PM roles, plus Class Pro: lifetime access to every course artifact (templates, PRDs, case studies, frameworks)."
  pricing: "Class Pro (all artifacts): 5,000 one-time. 6-month course: share on request."   # TODO: confirm currency and course price
  key_benefits:
    - "A structured 6-month path from current role to AI Product Manager"
    - "Real artifacts to reuse: AI PRDs, evaluation plans, model-selection and launch templates"
    - "Portfolio-ready projects to show in AI PM interviews"
    - "Learn directly from a practitioner, not a generic MOOC"
  objection_responses:
    "too expensive": "Totally fair. That's why Class Pro exists: every artifact from the course for 5k, so you can start on your own and join the full course later if it's working."
    "no time": "The course is designed around a full-time job. If even that is too much right now, Class Pro lets you go at your own pace."
    "I can learn this free online": "You can learn a lot free. What's hard to find is a sequenced path and real PM artifacts for AI products. That's the gap Class fills."
    "not sure AI PM is for me": "That's a good thing to figure out before committing. Happy to share a couple of the artifacts so you can see what the work actually looks like."
    "not interested": "No worries at all. If AI PM comes up for you later, feel free to reach out."
  offer:
    primary: "6-month AI Product Management course with Ambar Utkarsh"
    entry: "Class Pro: all course artifacts for 5k"
    goal: "get_reply"
    booking_method: "ask_preference"   # switch to calendar_link once booking_url is set
    booking_url: ""                    # TODO: course page or Calendly link
    meeting_duration: "15 minutes"
    meeting_owner: "Ambar Utkarsh"

icp:
  industries:
    - "Software"
    - "IT Services"
    - "Fintech"
    - "E-commerce"
    - "Consulting"
    - "SaaS"
  company_size: "Any"
  titles:
    - "Product Manager"
    - "Associate Product Manager"
    - "Product Analyst"
    - "Business Analyst"
    - "Software Engineer"
    - "Data Analyst"
    - "Program Manager"
    - "Management Consultant"
  geography:
    - "India"
    - "United States"
    - "United Kingdom"
    - "United Arab Emirates"
    - "Singapore"
    - "Canada"
  hiring_signals:
    - "AI Product Manager"
    - "Product Manager, AI"
    - "Product Manager, Machine Learning"

channels:
  email:
    enabled: true
    provider: "gmail"
    max_daily_sends: 30
    require_approval: true
    send_to_risky: false
    max_bounce_rate: 0.05
  linkedin:
    enabled: false      # LinkedIn automation breaks LinkedIn's terms; off by default
    max_daily_connections: 20
    max_daily_messages: 10

usage:
  max_daily_claude_percent: 40   # two Harvey instances share one Claude plan
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "22:00"
    end: "07:00"
    timezone: "Asia/Kolkata"     # TODO: your timezone
